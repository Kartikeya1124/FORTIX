<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FortiX — API Security & Resilience Gateway</title>
    <meta name="description" content="Automated resilience experimentation, real-time security telemetry, and verification gateway for mission-critical APIs." />
    <meta property="og:title" content="FortiX — API Security & Resilience Gateway" />
    <meta property="og:description" content="Automated resilience experimentation, real-time security telemetry, and verification gateway for mission-critical APIs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('fortix_theme_v2');
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
      // Gracefully ignore disabled-HMR WebSocket connection events per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && (
          String(event.reason.message || event.reason).includes('WebSocket closed without opened') ||
          String(event.reason.message || event.reason).includes('failed to connect to websocket')
        )) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
